<body>

    <h1>你好:{{ name }}</h1>
    <h2>
        <a href="https://www.google.com" target="_blank">
        苦瓜的健康料理－苦瓜鑲肉
        </a>
    </h2>
    
    <ul>
        <li>材料</li>
            <ol type="a">
                <li>苦瓜</li>
                <li>大白菜</li>
                <li>豬肉絞肉</li>
                <li>太白粉</li>
                <li>鹽</li>
            </ol>

        <li>做法</li>
            <ol>
                <li>苦瓜橫切成數塊，然後將內膜和子去除乾淨，使其成中空圓狀。</li>
                <li>鹽漬數分鐘去除苦味。</li>
                <li>將豬肉絞肉鑲進中空圓狀的苦瓜中，然後沾少許太白粉水，使其黏固。</li>
                <li>用油煎熟，然後加入大白菜及少許水悶煮數分鐘即可。</li>
            </ol>
    </ul>


</body>
